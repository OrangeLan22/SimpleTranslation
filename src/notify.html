<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>简译</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f7f8fa;
      --text: #16181d;
      --text-dim: #5b616e;
      --border: #e3e6eb;
      --accent: #3b6ef6;
      --accent-soft: rgba(59, 110, 246, 0.1);
    }

    :root[data-theme="dark"] {
      --bg: #1c1f25;
      --panel: #212429;
      --text: #e8eaee;
      --text-dim: #98a0ae;
      --border: #2b2f37;
      --accent: #5b86ff;
      --accent-soft: rgba(91, 134, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;


      background: var(--bg);
    }

    body {
      display: flex;
      align-items: stretch;
      
      padding: 0;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    }

    
    .card {
      position: relative; 
      flex: 1;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 14px;
      background: var(--bg);
      
      border: none;
      border-radius: 0;
      box-shadow: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .card:hover {
      background: var(--panel);
    }

    .icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      background: transparent;
      -webkit-user-drag: none;
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 12.5px;
      font-weight: 650;
      color: var(--text);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .desc {
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--text-dim);
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag {
      display: inline-block;
      padding: 1px 6px;
      margin-right: 5px;
      border-radius: 6px;
      corner-shape: squircle;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .arrow {
      flex: 0 0 auto;
      color: var(--text-dim);
      opacity: 0.5;
    }

    .arrow svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    
    .close {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 6px;
      corner-shape: squircle;
      background: transparent;
      color: var(--text-dim);
      opacity: 0.65;
      cursor: pointer;
      transition: opacity 0.14s, background 0.14s, color 0.14s;
    }

    .close:hover {
      opacity: 1;
      background: var(--border);
      color: var(--text);
    }

    .close svg {
      width: 11px;
      height: 11px;
      display: block;
    }

    
    
    .progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      margin: 0;
      z-index: 2;
      background: var(--accent);
      transform-origin: left center;
      animation: shrink 4.2s linear forwards;
    }


    @keyframes shrink {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <img class="icon" src="assets/app-icon.png" alt="" />
    <div class="content">
      <div class="title">简译有新版本</div>
      <div class="desc"><span class="tag" id="ver">—</span>点此查看更新详情</div>
    </div>
    <span class="arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>
    <button class="close" id="btn-close" type="button" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
        <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
      </svg>
    </button>
    <div class="progress" id="progress"></div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const $ = (id) => document.getElementById(id);

    const AUTO_CLOSE_MS = 4200;
    let closeTimer = null;

    function scheduleClose() {
      if (closeTimer) clearTimeout(closeTimer);
      closeTimer = setTimeout(() => {
        closeTimer = null;
        invoke("close_notify").catch((err) => {
          document.title = "close failed: " + err;
        });
      }, AUTO_CLOSE_MS);
    }

    function applyInfo(info) {
      if (!info) return;
      if (info.version) $("ver").textContent = info.version;

                  const bar = $("progress");
      if (bar) {
        bar.style.animation = "none";
        void bar.offsetWidth;
        bar.style.animation = "";
      }

      scheduleClose();
    }

    listen("notify-show", (event) => applyInfo(event.payload));

            (async () => {
      try {
        const pending = await invoke("take_pending_notify");
        if (pending) applyInfo(pending);
      } catch {}
    })();

        $("btn-close").addEventListener("click", async (e) => {
      e.stopPropagation();
      if (closeTimer) {
        clearTimeout(closeTimer);
        closeTimer = null;
      }
      await invoke("close_notify").catch(() => {});
    });

        $("card").addEventListener("click", async () => {
      await invoke("show_update_log").catch(() => {});
      await invoke("close_notify").catch(() => {});
    });

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
    }

        (async () => {
      try {
        const cfg = await invoke("get_config");
        applyTheme(cfg && cfg.theme);
      } catch {
        
      }
    })();

        listen("config-changed", (event) => {
      const cfg = event.payload;
      if (cfg && cfg.theme) applyTheme(cfg.theme);
    });
  </script>
</body>
</html>
